<main class="flex-grow-1 py-5 bg-dark text-white min-vh-100">
  <section class="px-4 px-md-5">
    <h1 class="fw-bold display-5 mb-5 text-center text-uppercase">Catálogo de <span class="text-warning">Figuras</span></h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

      @for (producto of listaProductos; track producto.nombre) {
        <article class="col">

          <div class="card h-100 bg-dark border-secondary border-opacity-25 shadow-lg text-white product-card">

            <div class="position-relative p-2 d-flex align-items-center justify-content-center" style="height: 200px;">
              @if (producto.nuevo) {
                <span class="badge bg-danger position-absolute top-0 start-0 m-2 z-1">¡Nuevo!</span>
              }

              <img [ngSrc]="producto.imagen"
                   width="300"
                   height="250"
                   class="img-fluid rounded-3"
                   [alt]="'Figura de ' + producto.nombre"
                   style="max-height: 100%; width: auto; object-fit: contain;"
                   priority>
            </div>

            <div class="card-body d-flex flex-column text-center p-2">
              <h3 class="h6 card-title fw-bold text-uppercase mb-1">{{producto.nombre}}</h3>
              <p class="small text-secondary mb-2">{{producto.serie}}</p>

              <div class="mt-auto">
                <p class="text-warning fw-bold fs-5 mb-2">{{producto.precio}}€</p>

                <button (click)="agregarAlCarrito(producto.nombre, producto.precio, producto.imagen)"
                        class="btn btn-warning w-100 rounded-pill fw-bold text-dark text-uppercase shadow-sm btn-sm">
                  <i class="bi bi-cart-plus me-1"></i> Añadir al equipo
                </button>
              </div>
            </div>
          </div>
        </article>
      }

    </div>
  </section>
</main>
