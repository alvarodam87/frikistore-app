<main class="py-5 bg-dark text-white min-vh-100">
  <div class="container">
    @if (producto) {
      <div class="row bg-secondary bg-opacity-10 border border-secondary rounded-4 shadow-lg p-4">

        <div class="col-md-6 d-flex justify-content-center align-items-center bg-white rounded-4 p-4 mb-4 mb-md-0">
          <img [src]="producto.imagen" class="img-fluid" [alt]="producto.nombre" style="max-height: 400px; object-fit: contain;">
        </div>

        <div class="col-md-6 d-flex flex-column justify-content-center px-md-5">
          @if (producto.nuevo) {
            <span class="badge bg-danger mb-3 align-self-start fs-6 shadow">¡NOVEDAD!</span>
          }
          <h1 class="display-5 fw-bold text-warning mb-2">{{ producto.nombre }}</h1>
          <h4 class="text-secondary text-uppercase mb-4">{{ producto.serie }}</h4>

          <p class="fs-5 mb-4 opacity-75">
            Figura exclusiva de importación directa. 100% original con certificado de autenticidad.
          </p>

          <p class="display-4 fw-bold mb-4">{{ producto.precio }}€</p>

          <div class="d-flex gap-3 mt-auto">
            <button (click)="agregarAlCarrito()" class="btn btn-warning btn-lg fw-bold flex-grow-1 rounded-pill">
              <i class="bi bi-cart-plus me-2"></i> AÑADIR AL EQUIPO
            </button>

            <a routerLink="/catalogo" class="btn btn-outline-light btn-lg fw-bold rounded-pill px-4">
              VOLVER
            </a>
          </div>
        </div>
      </div>
    } @else {
      <div class="text-center py-5">
        <h2 class="text-warning">Cargando datos del radar...</h2>
      </div>
    }
  </div>
</main>
