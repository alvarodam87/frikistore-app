<main class="py-5 bg-dark text-white min-vh-100">
  <div class="container">
    <div class="text-center mb-5">
      <h1 class="fw-bold display-4 text-warning">CATÁLOGO GEEK</h1>
      <p class="lead text-secondary">Copiando el estilo que sí funciona</p>
    </div>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-4 g-4">
      @for (item of listaProductos; track item.id) {
        <div class="col">
          <div class="card h-100 bg-secondary bg-opacity-10 border-secondary border-opacity-25 shadow text-white">

            <div class="position-relative">
              @if (item.nuevo) {
                <span class="badge bg-danger position-absolute top-0 start-0 m-3 shadow">NUEVO</span>
              }
              <img [src]="item.imagen" class="card-img-top p-4 img-fluid" alt="{{item.nombre}}" style="height: 250px; object-fit: contain;">
            </div>

            <div class="card-body d-flex flex-column text-center">
              <h5 class="card-title fw-bold text-warning">{{item.nombre}}</h5>
              <p class="small text-secondary text-uppercase mb-3">{{item.serie}}</p>

              <div class="mt-auto">
                <p class="fw-bold fs-4 mb-3">{{item.precio}}€</p>

                <a [routerLink]="['/producto', item.id]"
                   class="btn btn-warning w-100 rounded-pill fw-bold text-dark mb-2">
                  VER MÁS
                </a>
                <button (click)="agregarAlCarrito(item)"
                        class="btn btn-outline-light w-100 rounded-pill fw-bold btn-sm">
                  AÑADIR AL EQUIPO
                </button>
              </div>
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</main>
